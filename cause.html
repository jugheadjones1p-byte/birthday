<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why I Love You! 💖</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./cause.css">
    <style>
        /* optional extra style for love theme */
        body {
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            color: #ff3366;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
        }
        .shuffle-button {
            background: #ff69b4;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .ending-text {
            font-size: 1.8rem;
            text-align: center;
            margin-top: 20px;
            color:#ff3366;
        }
    </style>
</head>
<body>
    <div class="custom-cursor">
        <svg viewBox="0 0 24 24">
            <path fill="#ff69b4" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <div class="container">
        <h1>Happy Birthday My Love 💖</h1>
        
        <div id="reasons-container"></div>
        
        <button class="shuffle-button">Click to see why I love you ❤️</button>
        <div class="reason-counter"></div>

        <div class="ending-section">
            <div class="teddy-hug">
                <img src="./love_image.jpg" alt="Love Image" style="border-radius:20px; max-width:300px;">
            </div>
            <div class="ending-text">You're my everything! 💖</div>
        </div>
    </div>

    <script src="cause.js"></script>
</body>
</html>
